<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BSB Pilot Workflow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css?v=20260924g">
</head>
<body>

<div id="error-banner" class="error-banner" hidden role="alert"></div>

<header class="topbar">
  <div class="topbar-inner">
    <div class="topbar-title">
      <h1 id="meta-title"></h1>
    </div>
    <div class="topbar-actions">
      <button id="edit-toggle" class="btn btn-ghost" type="button" aria-pressed="false">Edit mode: Off</button>
      <button id="open-questions-btn" class="btn btn-primary" type="button">
        <span id="oq-count">0</span> Open Questions
      </button>
    </div>
  </div>
</header>

<main class="main">
  <section class="stage-group" aria-label="New Assignment">
    <div id="journey-new-assignment" class="journey"></div>
    <div class="grid-scroll">
      <div id="grid-new-assignment" class="grid" role="table" aria-label="New Assignment process grid"></div>
    </div>
  </section>

  <section class="stage-group" aria-label="Estimate Follow-up">
    <div id="journey-estimate-followup" class="journey"></div>
    <div class="grid-scroll">
      <div id="grid-estimate-followup" class="grid" role="table" aria-label="Estimate Follow-up process grid"></div>
    </div>
  </section>

</main>

<div id="panel-backdrop" class="panel-backdrop" hidden></div>
<aside id="panel" class="panel" hidden aria-hidden="true">
  <div class="panel-inner">
    <div class="panel-topbar">
      <div class="panel-position" id="panel-position"></div>
      <button id="panel-close" class="btn btn-icon" type="button" aria-label="Close panel">&times;</button>
    </div>
    <div id="panel-content" class="panel-content"></div>
    <div class="panel-nav">
      <button id="panel-prev" class="btn btn-ghost" type="button">&larr; Previous</button>
      <button id="panel-next" class="btn btn-ghost" type="button">Next &rarr;</button>
    </div>
  </div>
</aside>

<div id="modal-backdrop" class="modal-backdrop" hidden></div>
<div id="questions-modal" class="modal" hidden role="dialog" aria-modal="true" aria-labelledby="modal-title">
  <div class="modal-inner">
    <div class="modal-header">
      <h2 id="modal-title">Open Questions</h2>
      <div class="modal-header-actions">
        <button id="copy-questions" class="btn btn-ghost" type="button">Copy all</button>
        <button id="modal-close" class="btn btn-icon" type="button" aria-label="Close">&times;</button>
      </div>
    </div>
    <div id="modal-body" class="modal-body"></div>
  </div>
</div>

<div id="copy-toast" class="toast" hidden>Copied to clipboard</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="content.js?v=20260924e"></script>
<script src="app.js?v=20260925a"></script>
<script src="sync.js?v=20260923"></script>
</body>
</html>
